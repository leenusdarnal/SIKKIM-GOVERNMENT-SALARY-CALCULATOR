name: Quality checks

on:
  push:
    branches: [main, rewrite/sveltekit-tailwind]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Run salary unit and integration tests
        run: npm test
      - name: Install Playwright Chromium
        run: npx playwright install chromium
      - name: Run browser workflow tests
        run: npm run test:e2e
      - name: Build for Vercel
        run: npm run build
