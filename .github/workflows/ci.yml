name: Quality checks

on:
  push:
    branches: [main, rewrite/sveltekit-tailwind]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm install
      - name: Check Svelte and TypeScript
        run: npm run check
      - name: Run salary tests
        run: npm test
      - name: Build for Vercel
        run: npm run build
